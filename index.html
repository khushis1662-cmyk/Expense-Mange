<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divinam Structuray - Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .text-primary { color: #003366; }
        .bg-primary { background-color: #003366; }
        .border-accent { border-color: #FFD700; }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen p-4 sm:p-8">
        <header class="mb-8 p-6 bg-white shadow-lg rounded-2xl border-t-4 border-primary">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-primary flex items-center">
                <span class="mr-3">Divinam Structuray</span>
                <span class="text-2xl text-accent font-light italic">Expense Management</span>
            </h1>
            <p id="auth-status" class="text-sm text-gray-500 mt-2">Loading user session...</p>
            <p id="user-id-display" class="text-xs text-gray-400 mt-1 truncate">User ID: N/A</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-white p-6 shadow-xl rounded-2xl sticky top-8">
                    <h2 class="text-xl font-bold text-primary mb-4 border-b pb-2">Log New Expense</h2>
                    
                    <form id="expense-form" class="space-y-4">
                        <div>
                            <label for="employee-name" class="block text-sm font-medium text-gray-700">Employee Name/ID</label>
                            <input type="text" id="employee-name" required placeholder="e.g., John Doe" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary p-2 border">
                        </div>

                        <div>
                            <label for="type" class="block text-sm font-medium text-gray-700">Category</label>
                            <select id="type" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary p-2 border">
                                <option value="" disabled selected>Select Category</option>
                                <option value="Travel">✈️ Travel</option>
                                <option value="Food">🍔 Food / Meals</option>
                                <option value="Fuel">⛽ Fuel / Mileage</option>
                                <option value="Other">💼 Other Admin</option>
                            </select>
                        </div>

                        <div>
                            <label for="date" class="block text-sm font-medium text-gray-700">Date</label>
                            <input type="date" id="date" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary p-2 border">
                        </div>
                        
                        <div id="advance-group" class="border-l-4 border-green-500 p-2 bg-green-50 rounded-lg">
                            <label for="advance" class="block text-sm font-medium text-gray-800">Cash/Advance Received (INR)</label>
                            <input type="number" id="advance" min="0" step="0.01" value="0.00" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border">
                        </div>

                        <div>
                            <label for="amount" class="block text-sm font-medium text-gray-700">Amount Spent (INR)</label>
                            <input type="number" id="amount" required min="0.01" step="0.01" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border">
                        </div>

                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                            <textarea id="description" required rows="3" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border"></textarea>
                        </div>
                        
                        <button type="submit" id="submit-btn" class="w-full py-3 px-4 rounded-lg shadow-md text-sm font-medium text-white bg-primary hover:bg-opacity-90 flex items-center justify-center">
                            <span data-lucide="plus-circle" class="w-5 h-5 mr-2"></span> Add Expense
                        </button>
                    </form>
                    <p id="error-message" class="text-red-500 text-sm mt-3 hidden"></p>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-8">
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-xl border-l-4 border-red-500">
                        <span class="text-sm font-medium text-gray-500">Total Spent</span>
                        <p id="total-expenses" class="text-3xl font-extrabold mt-1 text-primary">₹0.00</p>
                    </div>
                    
                    <div id="net-balance-card" class="bg-white p-6 rounded-2xl shadow-xl border-l-4">
                        <span class="text-sm font-medium text-gray-500">Net Balance</span>
                        <p id="net-balance" class="text-3xl font-extrabold mt-1">₹0.00</p>
                        <p id="net-balance-status" class="text-xs mt-1 text-gray-400">Spent - Advance</p>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-xl border-l-4 border-yellow-500">
                        <span class="text-sm font-medium text-gray-500">Entries</span>
                        <p id="total-entries" class="text-3xl font-extrabold mt-1 text-primary">0</p>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <button id="export-csv-btn" class="flex-1 py-3 px-4 rounded-lg shadow-md text-sm font-medium text-primary border border-primary bg-white hover:bg-gray-50 flex items-center justify-center">
                        <span data-lucide="file-text" class="w-5 h-5 mr-2"></span> CSV (Excel)
                    </button>
                    <button id="export-pdf-btn" class="flex-1 py-3 px-4 rounded-lg shadow-md text-sm font-medium text-white bg-red-600 border border-red-600 hover:bg-red-700 flex items-center justify-center">
                        <span data-lucide="file-text" class="w-5 h-5 mr-2"></span> PDF Report
                    </button>
                </div>

                <div class="bg-white p-6 shadow-xl rounded-2xl">
                    <h2 class="text-xl font-bold text-primary mb-4 border-b pb-2 flex items-center">
                        <span data-lucide="filter" class="w-6 h-6 mr-2"></span> Filter Records
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase">Employee Name</label>
                            <input type="text" id="employee-filter" placeholder="Search name..." class="mt-1 w-full rounded-lg border-gray-300 shadow-sm p-2 border">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase">From Date</label>
                            <input type="date" id="start-date-filter" class="mt-1 w-full rounded-lg border-gray-300 shadow-sm p-2 border">
                        </div>
                        <div class="relative">
                            <label class="block text-xs font-semibold text-gray-500 uppercase">To Date</label>
                            <div class="flex items-center space-x-2">
                                <input type="date" id="end-date-filter" class="mt-1 w-full rounded-lg border-gray-300 shadow-sm p-2 border">
                                <button id="clear-filter-btn" class="text-gray-400 hover:text-red-600 mt-1" title="Clear Filters">
                                    <span data-lucide="refresh-ccw" class="w-5 h-5"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 shadow-xl rounded-2xl">
                    <h2 class="text-xl font-bold text-primary mb-4 border-b pb-2">Monthly Breakdown</h2>
                    <div id="monthly-summary-body" class="space-y-4">
                        <p class="text-gray-500 text-sm italic">Calculating...</p>
                    </div>
                </div>

                <div class="bg-white p-6 shadow-xl rounded-2xl">
                    <h2 class="text-xl font-bold text-primary mb-4 border-b pb-2">Transaction History</h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase">Employee</th>
                                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
                                    <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase">Description</th>
                                    <th class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase">Spent</th>
                                    <th class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase">Adv.</th>
                                    <th class="px-3 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="expense-list-body" class="bg-white divide-y divide-gray-200">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, deleteDoc, onSnapshot, collection, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZWHiXH6lTZugXbvrOx5gCsKorMAsHcy8",
            authDomain: "expense-tracker-307aa.firebaseapp.com",
            projectId: "expense-tracker-307aa",
            storageBucket: "expense-tracker-307aa.firebasestorage.app",
            messagingSenderId: "959798127464",
            appId: "1:959798127464:web:f1cec63888d59866d7c4dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let userId = null;
        let allExpenses = [];

        // DOM Elements
        const expenseForm = document.getElementById('expense-form');
        const employeeFilterInput = document.getElementById('employee-filter');
        const startDateFilter = document.getElementById('start-date-filter');
        const endDateFilter = document.getElementById('end-date-filter');
        const clearFilterBtn = document.getElementById('clear-filter-btn');
        const expenseListBody = document.getElementById('expense-list-body');
        
        // --- Initialization ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                document.getElementById('user-id-display').textContent = `User ID: ${userId}`;
                document.getElementById('auth-status').textContent = 'Live Sync Enabled';
                listenForExpenses();
            }
        });

        function listenForExpenses() {
            const path = `artifacts/${firebaseConfig.appId}/public/data/expenses`;
            onSnapshot(collection(db, path), (snapshot) => {
                allExpenses = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data(),
                    month: doc.data().date ? doc.data().date.substring(0, 7) : 'Unknown'
                }));
                applyFilterAndRender();
            });
        }

        // --- Core Filter Logic ---
        function applyFilterAndRender() {
            const nameVal = employeeFilterInput.value.trim().toLowerCase();
            const startVal = startDateFilter.value;
            const endVal = endDateFilter.value;

            // 1. Sort by Date (Newest First)
            allExpenses.sort((a, b) => b.date.localeCompare(a.date));

            // 2. Filter
            const filtered = allExpenses.filter(exp => {
                const matchesName = !nameVal || exp.employeeName?.toLowerCase().includes(nameVal);
                const matchesStart = !startVal || exp.date >= startVal;
                const matchesEnd = !endVal || exp.date <= endVal;
                return matchesName && matchesStart && matchesEnd;
            });

            renderUI(filtered);
        }

        // --- UI Updates ---
        function renderUI(data) {
            expenseListBody.innerHTML = '';
            let totalSpent = 0, totalAdv = 0;
            const monthlyMap = {};

            data.forEach(exp => {
                totalSpent += exp.amount;
                totalAdv += exp.advance;
                monthlyMap[exp.month] = (monthlyMap[exp.month] || 0) + exp.amount;

                const row = `
                    <tr class="hover:bg-gray-50">
                        <td class="px-3 py-4 text-sm font-medium text-gray-900">${exp.employeeName}</td>
                        <td class="px-3 py-4 text-sm text-gray-500">${exp.date}</td>
                        <td class="px-3 py-4 text-sm text-gray-500">${exp.type}</td>
                        <td class="px-3 py-4 text-sm text-gray-500 truncate max-w-[150px]">${exp.description}</td>
                        <td class="px-3 py-4 text-sm text-right font-bold text-red-600">₹${exp.amount.toFixed(2)}</td>
                        <td class="px-3 py-4 text-sm text-right text-green-600">₹${exp.advance.toFixed(2)}</td>
                        <td class="px-3 py-4 text-right">
                            <button onclick="window.deleteExp('${exp.id}')" class="text-red-400 hover:text-red-600"><span data-lucide="trash-2" class="w-4 h-4"></span></button>
                        </td>
                    </tr>`;
                expenseListBody.insertAdjacentHTML('beforeend', row);
            });

            // Update Summary Cards
            document.getElementById('total-expenses').textContent = `₹${totalSpent.toLocaleString()}`;
            document.getElementById('total-entries').textContent = data.length;
            const net = totalSpent - totalAdv;
            const netEl = document.getElementById('net-balance');
            netEl.textContent = `₹${net.toLocaleString()}`;
            netEl.className = `text-3xl font-extrabold mt-1 ${net > 0 ? 'text-red-600' : 'text-green-600'}`;

            // Monthly Summary render
            const monthBody = document.getElementById('monthly-summary-body');
            monthBody.innerHTML = Object.keys(monthlyMap).sort().reverse().map(m => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border-l-4 border-primary">
                    <span class="font-bold text-primary">${m}</span>
                    <span class="font-mono font-bold">₹${monthlyMap[m].toFixed(2)}</span>
                </div>
            `).join('') || '<p class="text-gray-400 italic">No data found</p>';

            lucide.createIcons();
        }

        // --- Event Listeners ---
        employeeFilterInput.addEventListener('input', applyFilterAndRender);
        startDateFilter.addEventListener('input', applyFilterAndRender);
        endDateFilter.addEventListener('input', applyFilterAndRender);
        clearFilterBtn.onclick = () => {
            employeeFilterInput.value = '';
            startDateFilter.value = '';
            endDateFilter.value = '';
            applyFilterAndRender();
        };

        expenseForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            
            try {
                const path = `artifacts/${firebaseConfig.appId}/public/data/expenses`;
                await addDoc(collection(db, path), {
                    employeeName: document.getElementById('employee-name').value,
                    type: document.getElementById('type').value,
                    date: document.getElementById('date').value,
                    amount: parseFloat(document.getElementById('amount').value),
                    advance: parseFloat(document.getElementById('advance').value || 0),
                    description: document.getElementById('description').value,
                    createdAt: serverTimestamp()
                });
                expenseForm.reset();
            } catch (err) {
                alert("Error saving: " + err.message);
            } finally {
                btn.disabled = false;
            }
        };

        window.deleteExp = async (id) => {
            if (confirm("Delete this entry?")) {
                const path = `artifacts/${firebaseConfig.appId}/public/data/expenses`;
                await deleteDoc(doc(db, path, id));
            }
        };

        signInAnonymously(auth);
    </script>
</body>
</html>
